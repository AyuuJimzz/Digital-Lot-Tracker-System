<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Lot Tracking System</title>
    <link rel="shortcut icon" href="/golden-dragon-logo.png" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      };
    </script>
    <script>
      // Early catch & suppress third-party browser extension runtime errors
      (function() {
        function isExtensionError(event) {
          const str = (event.filename || "") + " " + (event.message || "") + " " + (event.error?.stack || "");
          return str.includes("chrome-extension://") || str.includes("moz-extension://") || str.includes("M_ID") || str.includes("eppiocemhmnlbhjplcgkofciiegomcon");
        }
        window.addEventListener("error", function(e) {
          if (isExtensionError(e)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener("unhandledrejection", function(e) {
          const str = (e.reason?.message || "") + " " + (e.reason?.stack || "");
          if (str.includes("chrome-extension://") || str.includes("moz-extension://") || str.includes("M_ID")) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <script>
      // Apply saved theme on page load (no flash)
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <!-- <script type="module" src="/src/main.jsx"></script> -->
  </body>
</html>
